name: Symbio Robotics
description: >-
  Symbio Robotics is an AI industrial-automation company founded in 2014 and based
  in Emeryville, California. Its flagship product, SymbioDCS, is a robot-agnostic
  middleware and Python programming framework that lets automation teams build,
  deploy, and continuously improve AI-driven assembly applications on existing
  factory robots. Symbio has publicly worked with automakers including Ford, Nissan,
  and Toyota to speed transmission and vehicle assembly. SymbioDCS is deployed
  on-premises inside manufacturing lines rather than offered as a public web API;
  as of this enrichment pass the company exposes no public developer portal,
  documentation, SDK/package registry presence, MCP server, or API surface, and its
  former web domains (symb.io, symbiorobotics.com) now resolve to parked/for-sale
  landing pages.
